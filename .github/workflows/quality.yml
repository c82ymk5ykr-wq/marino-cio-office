name: Repository quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-validation.txt

      - name: Test schema enforcement
        run: python3 -m unittest discover --start-directory tests --pattern 'test_*.py'

      - name: Validate public baseline
        run: python3 scripts/validate.py
